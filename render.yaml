# Render Blueprint — deplo.ai API
# Docs: https://render.com/docs/blueprint-spec
#
# Dashboard fix (if not using Blueprint):
#   Root Directory:  server
#   Dockerfile Path: Dockerfile        ← NOT "server"
#   Docker Context:  server (or leave default)

services:
  - type: web
    name: deplo-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: PORT
        value: 4000
      # Set these in the Render dashboard (secrets):
      # DATABASE_URL, REDIS_URL, JWT_SECRET, ENCRYPTION_KEY,
      # GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_REDIRECT_URI,
      # ALLOWED_ORIGINS, VERCEL_TOKEN, RENDER_API_KEY
